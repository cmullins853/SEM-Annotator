[project]
name = "sem-annotator"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "nicegui>=3.18.0",
    "numpy>=2.4.4",
    "opencv-python>=4.13.0.92",
    "pillow>=12.2.0",
]

# Base install = the GUI. Extras (uv.lock pins all of them):
#   uv sync                      GUI only
#   uv sync --extra inference    + run the trained models (what the GUI pipeline will need)
#   uv sync --extra train        + training / dataset prep (includes inference)
# torch comes from PyPI: CUDA build on Linux, CPU build on Windows/macOS.
[project.optional-dependencies]
inference = [
    "timm>=1.0.30",
    "torch>=2.14.1",
    "tqdm>=4.70.1",
    "transformers>=5.21.0",
]
train = [
    "sem-annotator[inference]",
    "accelerate>=1.15.0",
    "matplotlib>=3.11.2",
    "nvidia-ml-py>=13.615.71",
    "rasterio>=1.5.2",
    "torchvision>=0.29.1",
]
